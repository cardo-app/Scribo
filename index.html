html{padding-top:env(safe-area-inset-top,0px);background:var(--pg-bg,#F5F6F8)}

input,textarea,select{font-size:max(16px,1em)}
body{margin:0}
/* ---------- Farben und Farbthemen: identisch mit Cardo ---------- */
:root{
  color-scheme:light;
  --b-paper:#F5F6F8; --b-surface:#FFFFFF; --b-surface-2:#F9FAFB; --b-ink:#15171C; --b-ink-2:#3A3F4B; --b-muted:#6B7080; --b-line:#E3E5EB; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#D93A3F; --hard:#C27A12; --good:#1E8C57; --easy:#2F6FE0;
  --g-again:#FF2E63; --g-hard:#FFE600; --g-good:#00E676; --g-easy:#00B4FF; --g-tx:0%; --g-bg:22%;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 6px 20px rgba(20,22,30,.06);
  --accent:#1B1D23; --accent-ink:#FFFFFF;
  --r:18px; --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#FF6B6F; --hard:#F0B04A; --good:#4CC38A; --easy:#6FA0FF;
  --g-again:#FF3D6E; --g-hard:#FFF01F; --g-good:#2BFF88; --g-easy:#1FC8FF; --g-tx:100%; --g-bg:0%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --accent:#ECEEF3; --accent-ink:#111318;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;

  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --accent:#ECEEF3; --accent-ink:#111318;
}
/* In-app choice (Einstellungen) overrides the viewer theme */
body.m-light{
  color-scheme:light;
  --b-paper:#F5F6F8; --b-surface:#FFFFFF; --b-surface-2:#F9FAFB; --b-ink:#15171C; --b-ink-2:#3A3F4B; --b-muted:#6B7080; --b-line:#E3E5EB; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;

  --g-again:#FF2E63; --g-hard:#FFE600; --g-good:#00E676; --g-easy:#00B4FF; --g-tx:0%; --g-bg:22%;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 6px 20px rgba(20,22,30,.06);
}
body.m-dark{
  color-scheme:dark;
  --b-paper:#0F1115; --b-surface:#181B21; --b-surface-2:#1E2129; --b-ink:#ECEEF3; --b-ink-2:#C9CDD6; --b-muted:#9097A6; --b-line:#2A2E38; --tp:0%; --ts:0%; --ts2:0%; --tl:0%; --tm:0%; --ti:0%;
  --again:#FF6B6F; --hard:#F0B04A; --good:#4CC38A; --easy:#6FA0FF;
  --g-again:#FF3D6E; --g-hard:#FFF01F; --g-good:#2BFF88; --g-easy:#1FC8FF; --g-tx:100%; --g-bg:0%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
/* Neutral modes: no colourful accents */
body.neutral{ --accent-soft:color-mix(in oklab,var(--accent) 9%,var(--surface)); }
body.neutral .st.new,body.neutral .st.mature,body.neutral .st.due{color:var(--ink-2);border-color:var(--line)}
body.neutral .st.due{background:var(--surface-2)}
/* Colour themes: whole interface tinted */
body.tinted.m-light{ --accent-text:color-mix(in oklab,var(--accent) 62%,var(--b-ink)); --tp:48%; --ts:16%; --ts2:28%; --tl:50%; --ti:38%;
  --muted:color-mix(in oklab,var(--accent) 50%,var(--b-ink)); --ink-2:color-mix(in oklab,var(--accent) 40%,var(--b-ink));
  --accent-soft:color-mix(in oklab,var(--accent) 40%,var(--surface)); }

  background-size:260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,260px 260px,170px 170px,170px 170px,170px 170px,170px 170px,170px 170px,170px 170px,100% 100%;
  background-repeat:repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,no-repeat;
}
body.tinted.m-dark{ --accent-text:color-mix(in oklab,var(--accent) 62%,#FFFFFF); --tp:26%; --ts:30%; --ts2:36%; --tl:46%; --ti:14%;
  --muted:color-mix(in oklab,var(--accent) 50%,var(--b-ink)); --ink-2:color-mix(in oklab,var(--accent) 30%,var(--b-ink));
  --accent-soft:color-mix(in oklab,var(--accent) 35%,var(--surface)); }
body{
  --accent-text:var(--accent);
  --paper:color-mix(in oklab,var(--accent) var(--tp),var(--b-paper));
  --surface:color-mix(in oklab,var(--accent) var(--ts),var(--b-surface));
  --surface-2:color-mix(in oklab,var(--accent) var(--ts2),var(--b-surface-2));
  --line:color-mix(in oklab,var(--accent) var(--tl),var(--b-line));
  --muted:color-mix(in oklab,var(--accent) var(--tm),var(--b-muted));
  --ink:color-mix(in oklab,var(--accent) var(--ti),var(--b-ink));
  --ink-2:color-mix(in oklab,var(--accent) calc(var(--ti) + 4%),var(--b-ink-2));
  --accent-soft:color-mix(in oklab,var(--accent) 15%,var(--surface));
  --seq1:color-mix(in oklab,var(--accent) 22%,var(--surface)); --seq2:color-mix(in oklab,var(--accent) 55%,var(--surface));
  --seq3:var(--accent); --seq4:color-mix(in oklab,var(--accent) 60%,var(--ink));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
html,body{overflow-x:clip}

/* ---------- Bibliothek ---------- */
#main{padding:18px 16px 60px;max-width:1120px;width:100%;margin:0 auto}
@media (min-width:900px){ #main{padding:32px 36px 80px} }
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar h1{font-size:33px;font-weight:800;min-width:0}
.tb-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.pill-sync{font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
.pill-sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.pill-sync.busy i{background:var(--easy)}
.pill-sync.local i,.pill-sync.err i,.pill-sync.setup i{background:var(--hard)}
@media (max-width:420px){.pill-sync span{display:none}.pill-sync{padding:9px}}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14.5px;color:var(--muted);margin-bottom:10px}
.crumbs button{color:var(--muted);font-weight:600;padding:2px 4px;border-radius:6px}
.crumbs button:hover{color:var(--ink);background:var(--surface)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 12px}
.sec-h h2{font-size:21px;font-weight:800}
.sec-h .muted{font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:28px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.tile{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile-main{display:block;width:100%;text-align:left}
.art{aspect-ratio:16/11;position:relative;background-color:var(--c,#888)}
.art.col{background-image:radial-gradient(circle at 85% 0%,color-mix(in oklab,var(--c) 45%,white) 0,transparent 60%),radial-gradient(circle at 0% 100%,color-mix(in oklab,var(--c) 70%,black) 0,transparent 55%)}
.art-emoji{position:absolute;left:12px;bottom:10px;font-size:37.5px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.tile-body{padding:11px 13px 12px}
.tile-name{font:800 18px/1.2 var(--display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-meta{font-size:12px;font-weight:500;color:var(--muted);margin-top:1px;opacity:.85}
.tile-more,.nc-more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.9);color:#15171C;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tile-more svg,.nc-more svg{width:15px;height:15px}
.tile.add{box-shadow:none;border:2px dashed var(--line);background:transparent;display:grid;place-items:center;min-height:170px;color:var(--muted);font-weight:700}
.tile.add:hover{border-color:var(--accent);color:var(--accent-text)}
.tile.add span{display:block;font-size:33px;text-align:center;line-height:1}
.banner{border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:24px}
.banner .art{aspect-ratio:auto;height:130px}
@media (min-width:700px){.banner .art{height:170px}}
.banner .art-emoji{font-size:50.5px;left:18px;bottom:14px}
.banner-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.banner h1{font-size:clamp(27px,7.4vw,35px);font-weight:800;line-height:1.08;letter-spacing:-.02em;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.banner-meta{font-size:12.5px;font-weight:500;margin-top:4px;opacity:.85}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15.5px;background:color-mix(in oklab,var(--ink) 5%,transparent);border:1px solid transparent;color:var(--ink-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{background:color-mix(in oklab,var(--ink) 9%,transparent);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--again)}
.btn.danger.armed{background:var(--again);color:#fff}
.btn.block{width:100%;justify-content:center;padding:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17.5px;margin-bottom:4px}
.empty .actions{justify-content:center;margin-top:14px}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:15px}
.hint b{display:block}
.hint i{width:10px;height:10px;border-radius:50%;background:var(--hard);flex:none;margin-top:7px}
/* Filter nach Art */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:650;font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.chip small{font-size:12.5px;color:var(--muted);font-weight:700}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on small{color:inherit;opacity:.7}
.kd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.kd.vl{background:var(--easy)}.kd.tu{background:var(--hard)}.kd.ue{background:var(--good)}.kd.so{background:var(--muted)}
/* Notiz-Karten */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;margin-bottom:28px}
@media (min-width:600px){.notes{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.nc{position:relative;min-width:0}
.nc-main{display:block;width:100%;text-align:left}
.nc-th{aspect-ratio:4/5;border-radius:14px;background:var(--surface-2);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);transition:transform .15s ease}
.nc-main:hover .nc-th{transform:translateY(-2px)}
.nc-th img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.nc-th .ph{width:62%;aspect-ratio:1/1.414;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12);background-image:linear-gradient(to bottom,transparent calc(100% - 1px),#D6DDEA 0);background-size:100% 9px}
.nc-b{padding:9px 2px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.nc-b b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-b span{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.nc-b span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-more{top:6px;right:6px}
.recent{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 26px;padding:2px 16px 8px}
.recent::-webkit-scrollbar{display:none}
.recent .nc{flex:none;width:150px}
@media (min-width:600px){.recent .nc{width:170px}}
/* Einstellungen */
.set-list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:0 auto 16px;max-width:720px}
.set-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;border-top:1px solid var(--line);min-height:58px}
.set-item:first-child{border-top:0}
button.set-item:hover{background:color-mix(in oklab,var(--ink) 4%,transparent)}
.si-t{font-weight:600;flex:1;min-width:0}
.si-t small{display:block;font-size:13.5px;color:var(--muted);font-weight:500}
.si-v{color:var(--muted);font-size:15.5px}
.set-group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:0 auto 18px;max-width:720px}
.set-group h2{font-size:20px;font-weight:800;margin-bottom:2px}
.set-group>p{margin:0 0 14px;color:var(--muted);font-size:15.5px}
.set-top{max-width:720px;margin-left:auto;margin-right:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:10px;font-weight:700;font-size:15.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl,.field>label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.switch{width:50px;height:30px;border-radius:99px;background:color-mix(in oklab,var(--ink) 18%,transparent);position:relative;flex:none;transition:background .2s ease}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.34,1.45,.55,1)}
.switch.on{background:var(--accent)}
.switch.on i{background:var(--accent-ink)}
.switch.on i{transform:translateX(20px)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px 8px}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;border-radius:14px;color:var(--muted);font-size:14.5px;font-weight:600}
.theme-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--tb);color:var(--tf);box-shadow:inset 0 0 0 1px rgba(128,128,128,.22);transition:transform .15s ease,box-shadow .15s ease}
.theme-ic svg{width:24px;height:24px}
/* 3D-Look der Themen-Buttons */
.themes{gap:18px 8px;padding-top:4px}
.theme .theme-ic{width:56px;height:56px;position:relative;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55) 0,rgba(255,255,255,.2) 25%,rgba(255,255,255,0) 60%),linear-gradient(to bottom,rgba(255,255,255,.1),rgba(0,0,0,.22)),var(--tb);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.08),0 5px 0 -1px rgba(0,0,0,.22),0 12px 18px -6px rgba(0,0,0,.4);
  transform:translateY(-2px);transition:transform .22s cubic-bezier(.34,1.45,.55,1),box-shadow .22s ease}
.theme .theme-ic svg{width:25px;height:25px;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.3))}
.theme[data-v="light"] .theme-ic{background:radial-gradient(circle at 35% 25%,#FFFFFF 0,#FFFFFF 45%,#F3F4F6 100%);color:#000}
.theme[data-v="light"] .theme-ic svg{filter:none;stroke-width:2.2}
.theme.on[data-v="light"] .theme-ic{box-shadow:inset 0 1px 2px rgba(0,0,0,.08),0 1px 0 rgba(0,0,0,.12),0 0 0 3px var(--surface),0 0 0 5.5px var(--ink)}
.theme[data-v="light"]:active .theme-ic{box-shadow:inset 0 1px 3px rgba(0,0,0,.1),0 1px 0 rgba(0,0,0,.15)}
.theme:hover .theme-ic{transform:translateY(-4px) scale(1.04);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.08),0 7px 0 -1px rgba(0,0,0,.2),0 18px 24px -8px rgba(0,0,0,.42)}
.theme:active .theme-ic,.theme.on .theme-ic{transform:translateY(2px);transition-duration:.08s}
.theme:active .theme-ic{box-shadow:inset 0 3px 7px rgba(0,0,0,.35),inset 0 -1px 1px rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.2)}
.theme.on{color:var(--ink);font-weight:700}
.theme.on .theme-ic{box-shadow:inset 0 3px 7px rgba(0,0,0,.32),inset 0 -1px 1px rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.15),0 0 0 3px var(--surface),0 0 0 5.5px var(--ink)}
.theme:active{transform:none}
@media (prefers-reduced-motion:reduce){.theme-ic,.theme .theme-ic{transition:none}}
.theme-ic.sm{width:32px;height:32px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.theme-ic.sm svg{width:16px;height:16px}
.theme[data-v="cardo"] .theme-ic{background:#fff;color:#1B1D23}
.theme[data-v="cardo"] .theme-ic svg{filter:none}

/* ---------- Blätter (Sheets), Menüs, Meldungen ---------- */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,18,.42)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#sheet{align-items:center}.sheet{border-radius:24px;padding:14px 24px 24px}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@media (min-width:700px){.grab{display:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:40px;gap:10px}
.sheet-h h2{font-size:23px;font-weight:800}
.xbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex:none;display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{padding:10px 4px;border-radius:12px;background:var(--surface-2);border:2px solid transparent;font-weight:700;font-size:14.5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2)}
.opt.on{border-color:var(--ink);color:var(--ink)}
.opt .pv{width:30px;height:40px;border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt .pv.q{width:40px;height:29px}
.pv.t-lined{background-image:linear-gradient(to bottom,transparent calc(100% - 1px),#B8C4DA 0);background-size:100% 5px}
.pv.t-grid{background-image:linear-gradient(to bottom,transparent calc(100% - 1px),#C9D2E2 0),linear-gradient(to right,transparent calc(100% - 1px),#C9D2E2 0);background-size:5px 5px}
.pv.t-dots{background-image:radial-gradient(circle,#A9B3C4 .8px,transparent 1.2px);background-size:5px 5px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper .in{text-align:center;font-weight:700}
.stepper button{flex:none;width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:20px;font-weight:700}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.emojis button{height:40px;border-radius:10px;font-size:23px;background:var(--surface-2);border:2px solid transparent}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.file-box{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);margin-bottom:16px}
.file-box svg{width:28px;height:28px;flex:none;color:var(--again)}
.file-box b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-box span{font-size:13.5px;color:var(--muted)}
.file-box>div{min-width:0;flex:1}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.sheet-foot .r{display:flex;gap:8px;margin-left:auto}
#menu{position:fixed;z-index:60;max-height:calc(100vh - 100px);overflow:auto;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
#menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;text-align:left;font-weight:600;font-size:15.5px}
#menu button svg{width:18px;height:18px;flex:none;color:var(--muted)}
#menu button:hover{background:var(--surface-2)}
#menu button.danger{color:var(--again)}
#menu button.danger svg{color:var(--again)}
#menu button .ck{margin-left:auto;color:var(--accent-text);font-weight:800}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:12px;font-weight:600;font-size:15.5px;box-shadow:var(--shadow);max-width:88vw;animation:toastIn .45s cubic-bezier(.34,1.45,.55,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(70%);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheetOut{from{transform:none;opacity:1}to{transform:translateY(60%);opacity:0}}

/* ---------- Startanimation beim ersten Öffnen nach der Installation (Aufbau, Farben und Zeiten wie bei Cardo) ---------- */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 260px 0 #fff;transition:opacity .35s ease,visibility .35s}

.sp-stage{position:relative;z-index:1;width:112px;height:112px;will-change:transform;animation:spRot .85s cubic-bezier(.42,0,.2,1) .05s forwards}
.sp-stage svg{width:112px;height:112px;display:block;overflow:visible}
.sp-l{position:absolute;inset:0;will-change:transform,opacity}
.sp-arc{transform-origin:50% 50%;animation:spArcOut .55s ease 1s forwards}
.sp-dot{animation:spHide 0s linear .9s forwards}
.sp-ball{position:absolute;z-index:2;left:calc(50% - 7.875px);top:calc(50% - 7.875px);width:15.75px;height:15.75px;border-radius:50%;background:radial-gradient(75% 75% at 38% 32%,#FF7A55,#F2491F);opacity:0;will-change:transform;animation:spLaunch .85s cubic-bezier(.3,.62,.5,1) .9s forwards}
.sp-ball::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,54,.55) 0,rgba(255,90,54,.18) 45%,transparent 70%);opacity:0;animation:spGlow .6s ease 1.2s forwards}
@keyframes spRot{to{transform:rotate(-180deg)}} /* halbe Drehung: danach steht das S wieder genauso da */
@keyframes spArcOut{to{opacity:0;transform:scale(.88)}}
@keyframes spHide{to{opacity:0}}
@keyframes spGlow{to{opacity:1}}

  background:var(--gl-bg);-webkit-backdrop-filter:blur(var(--gl-blur,8px)) saturate(190%) brightness(1.04);backdrop-filter:blur(var(--gl-blur,8px)) saturate(190%) brightness(1.04);
  box-shadow:inset 0 0 0 .5px var(--gl-rim),inset 1.5px 1.5px 1px -1px var(--gl-edge),inset -1.5px -1.5px 1px -1px var(--gl-edge),inset 0 0 10px rgba(255,255,255,.07),var(--gl-drop)}
/* Glas-Pille: Position über --pill (0/1/2); beim Seitenwischen setzt place() den Wert direkt, damit sie mit dem Finger mitläuft */

  background:radial-gradient(ellipse 55% 38% at calc((32 + clamp(0, var(--pill), 2) * 18) * 1%) 16%,rgba(255,255,255,var(--gl-spec)),transparent 72%),radial-gradient(ellipse 85% 55% at 50% 118%,rgba(255,255,255,var(--gl-caus)),transparent 70%),var(--gl-pill);
  box-shadow:inset 0 0 0 .5px var(--gl-rim),inset 0 1.5px 1px -.5px var(--gl-edge),inset 0 -2px 3px -1px rgba(255,255,255,var(--gl-caus)),inset 0 -8px 12px -8px rgba(0,0,0,var(--gl-deep)),0 4px 12px rgba(0,0,0,.10);

  transform:translateX(calc(clamp(0, var(--pill), 2) * 100% + (max(0, var(--pill) - 2) - max(0, 0 - var(--pill))) * 40%)) scaleX(calc(1 - (var(--sq) + var(--ov)) * .8));transform-origin:var(--so,center);}

/* ============================================================
   Speicher: IndexedDB auf dem Gerät (auch große Dateien) + Abgleich mit Supabase
   Jede Zeile in Supabase = ein Dokument (Pfad → Daten), wie bei Cardo:
     folders/<id>, notes/<id>, thumbs/<id>, settings/main, ink/<notiz>/<seite> (Striche einer Seite)
   PDFs/Bilder liegen im privaten Storage-Bucket note-files/<user>/<datei>.
   ============================================================ */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("cardo-notizen", 1);
    r.onupgradeneeded = () => { const d = r.result; ["meta","ink","pend","files","fup"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (st, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(st, mode), s = t.objectStore(st); let out; const q = fn(s); if (q) q.onsuccess = () => { out = q.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  const range = p => IDBKeyRange.bound(p, p + "￿");
  return {
    get: (st, k) => run(st, "readonly", s => s.get(k)),
    put: (st, k, v) => run(st, "readwrite", s => { s.put(v, k); }),
    del: (st, k) => run(st, "readwrite", s => { s.delete(k); }),

const isMissing = e => { const m = String((e && (e.message || e.error)) || ""); return (e && (e.code === "42P01" || e.code === "PGRST205" || e.statusCode === "404")) || /does not exist|could not find the table|bucket not found/i.test(m); };
function setSync(s){ if (S.sync === s) return; S.sync = s; const p = $(".pill-sync"); if (p && !ED.on) render(); }

function makeStore(uidv){
  const K = p => uidv + "|" + p, KL = uidv.length + 1;
  const meta = new Map(), pend = new Map(), subs = new Set(), inkSubs = new Set();
  let ver = 0, flushT = 0, flushing = false, setup = false, fileBusy = false, emitT = 0;
  const emit = () => { clearTimeout(emitT); emitT = setTimeout(() => subs.forEach(f => f()), 0); };
  const done = (path, v) => { const x = pend.get(path); if (x && x.v === v) { pend.delete(path); idb.del("pend", K(path)).catch(() => {}); } };
  const schedule = ms => { clearTimeout(flushT); flushT = setTimeout(flush, ms); };
  async function init(){
    try {
      (await idb.list("meta", K(""))).forEach(([k, v]) => meta.set(k.slice(KL), v));
      (await idb.list("pend", K(""))).forEach(([k, v]) => { const p = k.slice(KL); pend.set(p, { d: v, v: ++ver }); if (!p.startsWith("ink/")) { if (v === null) meta.delete(p); else meta.set(p, v); } });
    } catch (e) { console.warn("idb", e); }
  }
  function write(path, d){
    const ink = path.startsWith("ink/");
    if (!ink) { if (d === null) meta.delete(path); else meta.set(path, d); }
    (d === null ? idb.del(ink ? "ink" : "meta", K(path)) : idb.put(ink ? "ink" : "meta", K(path), d)).catch(e => console.warn("idb", e));
    if (SB) { pend.set(path, { d, v: ++ver }); idb.put("pend", K(path), d).catch(() => {}); if (S.sync === "ok") setSync("busy"); schedule(ink ? 900 : 400); }
    if (!ink) emit();
  }
  async function flush(){
    if (!SB || flushing || setup || !navigator.onLine) return;
    if (!pend.size) { setSync("ok"); return; }
    flushing = true; setSync("busy");
    try {
      const items = [...pend.entries()], ups = items.filter(([, x]) => x.d !== null), dels = items.filter(([, x]) => x.d === null);
      for (let i = 0; i < ups.length;) {
        const batch = []; let size = 0;
        while (i < ups.length && batch.length < 40) { const s = JSON.stringify(ups[i][1].d).length; if (batch.length && size + s > 1500000) break; batch.push(ups[i]); size += s; i++; }
        const now = new Date().toISOString();
        const r = await SB.from(TABLE).upsert(batch.map(([path, x]) => ({ user_id: uidv, path, data: x.d, updated_at: now })));
        if (r.error) throw r.error;
        batch.forEach(([path, x]) => done(path, x.v));
      }
      for (let i = 0; i < dels.length; i += 100) {
        const b = dels.slice(i, i + 100), r = await SB.from(TABLE).delete().eq("user_id", uidv).in("path", b.map(x => x[0]));
        if (r.error) throw r.error; b.forEach(([p, x]) => done(p, x.v));
      }
      setSync(pend.size ? "busy" : "ok");
    } catch (e) {
      console.warn("sync", e);
      if (isMissing(e)) { setup = true; setSync("setup"); } else { setSync("err"); schedule(8000); }
    }
    flushing = false;
    if (pend.size && !setup && S.sync !== "err") schedule(60);
  }
  async function loadMeta(){
    if (!SB || !navigator.onLine) return;
    const all = []; let from = 0;
    while (true) {
      const r = await SB.from(TABLE).select("path,data").not("path", "like", "ink/%").range(from, from + 999);
      if (r.error) { if (isMissing(r.error)) { setup = true; setSync("setup"); return; } throw r.error; }
      all.push(...r.data); if (r.data.length < 1000) break; from += 1000;
    }
    setup = false;
    const remote = new Map(all.map(x => [x.path, x.data])), puts = [];
    for (const p of [...meta.keys()]) if (!remote.has(p) && !pend.has(p)) { meta.delete(p); idb.del("meta", K(p)).catch(() => {}); }
    remote.forEach((d, p) => { if (pend.has(p)) return; if (JSON.stringify(meta.get(p)) !== JSON.stringify(d)) { meta.set(p, d); puts.push([K(p), d]); } });
    if (puts.length) await idb.putMany("meta", puts).catch(() => {});
    emit(); if (pend.size) flush(); else setSync("ok");
  }
  async function localInk(nid){
    const pre = K("ink/" + nid + "/"), out = {};
    try { (await idb.list("ink", pre)).forEach(([k, v]) => { out[k.slice(pre.length)] = v; }); } catch {}
    return out;
  }
  async function remoteInk(nid){
    if (!SB || setup || !navigator.onLine) return null;
    const pre = "ink/" + nid + "/", r = await SB.from(TABLE).select("path,data").like("path", pre + "%");
    if (r.error) throw r.error;
    const out = {}, puts = [];
    r.data.forEach(x => { if (pend.has(x.path)) return; out[x.path.slice(pre.length)] = x.data; puts.push([K(x.path), x.data]); });
    if (puts.length) await idb.putMany("ink", puts).catch(() => {});
    return out;
  }
  async function dropInk(nid, pids){ pids.forEach(pid => write("ink/" + nid + "/" + pid, null)); }
  if (SB) {
    SB.channel("notes-" + uidv).on("postgres_changes", { event: "*", schema: "public", table: TABLE, filter: "user_id=eq." + uidv }, ev => {
      const row = ev.eventType === "DELETE" ? ev.old : ev.new; if (!row || (row.user_id && row.user_id !== uidv)) return;
      const path = row.path; if (!path || pend.has(path)) return;
      const del = ev.eventType === "DELETE";
      if (path.startsWith("ink/")) { (del ? idb.del("ink", K(path)) : idb.put("ink", K(path), ev.new.data)).catch(() => {}); inkSubs.forEach(f => f(path, del ? null : ev.new.data)); return; }
      if (del) { meta.delete(path); idb.del("meta", K(path)).catch(() => {}); } else { meta.set(path, ev.new.data); idb.put("meta", K(path), ev.new.data).catch(() => {}); }
      emit();
    }).subscribe();
    addEventListener("online", () => { flush(); flushFiles(); loadMeta().catch(() => {}); });
  }
  /* Dateien (PDF/Bilder): zuerst auf dem Gerät, dann Upload in den privaten Bucket */
  async function putFile(fid, blob){
    const buf = await blob.arrayBuffer();
    await idb.put("files", fid, { type: blob.type || "application/octet-stream", buf });
    if (SB) { await idb.put("fup", K(fid), 1); flushFiles(); }
  }
  async function flushFiles(){
    if (!SB || fileBusy || !navigator.onLine) return; fileBusy = true;
    try {
      for (const [k] of await idb.list("fup", K(""))) {
        const fid = k.slice(KL), f = await idb.get("files", fid);
        if (!f) { await idb.del("fup", k); continue; }
        const r = await SB.storage.from(BUCKET).upload(uidv + "/" + fid, new Blob([f.buf], { type: f.type }), { contentType: f.type, upsert: true });
        if (r.error) throw r.error;
        await idb.del("fup", k);
      }
      if (S.fileSetup) { S.fileSetup = false; if (!ED.on) render(); }
    } catch (e) { console.warn("upload", e); if (isMissing(e) && !S.fileSetup) { S.fileSetup = true; if (!ED.on) render(); } setTimeout(flushFiles, 20000); }
    fileBusy = false;
  }
  async function getFile(fid){
    const f = await idb.get("files", fid).catch(() => null); if (f) return f;
    if (!SB) return null;
    const r = await SB.storage.from(BUCKET).download(uidv + "/" + fid); if (r.error) throw r.error;
    const v = { type: r.data.type, buf: await r.data.arrayBuffer() };
    idb.put("files", fid, v).catch(() => {}); return v;
  }
  function delFile(fid){ idb.del("files", fid).catch(() => {}); idb.del("fup", K(fid)).catch(() => {}); if (SB) SB.storage.from(BUCKET).remove([uidv + "/" + fid]).catch(() => {}); }
  let lastLoad = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !SB) return;
    fetchCardoLook();
    if (Date.now() - lastLoad > 20000) { lastLoad = Date.now(); loadMeta().catch(() => {}); if (ED.on) ED.pullRemote(); }
    flush(); flushFiles();
  });
  return { meta, init, write, flush, loadMeta, localInk, remoteInk, dropInk, putFile, getFile, delFile, flushFiles,
    on: f => subs.add(f), onInk: f => inkSubs.add(f), pendingCount: () => pend.size, isSetup: () => !setup };
}

function fixBottomGap(){
  document.documentElement.classList.toggle("ios-standalone", isIOS && (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches));
  let g = 0;
  const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "") || !!(document.activeElement && document.activeElement.isContentEditable);
  if (isIOS && standalone && !typing) {
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;bottom:0;left:0;width:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px)";
    document.body.appendChild(probe);

    if (insetTop < 1) { document.documentElement.style.setProperty("--vgap", "0px"); return; }
    const portrait = matchMedia("(orientation: portrait)").matches;
    const screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    g = Math.round(screenH - boxH); if (g < 2 || g > 140) g = 0;
  }

}

/* ---------- PDF / Bilder einlesen ---------- */
let pdfjsP = null;
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsP) return pdfjsP;
  pdfjsP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = PDFJS + "pdf.min.js"; s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; res(window.pdfjsLib); }; s.onerror = () => { pdfjsP = null; rej(new Error("pdf.js")); }; document.head.appendChild(s); });
  return pdfjsP;
}
const isPdf = f => /pdf/i.test(f.type) || /\.pdf$/i.test(f.name || "");
async function readFileInfo(file){
  if (file.size > 50 * 1048576) throw new Error("zu groß");
  if (isPdf(file)) {
    const lib = await loadPdfJs(), doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, pages = [];
    for (let i = 1; i <= doc.numPages; i++) { const vp = (await doc.getPage(i)).getViewport({ scale: 1 }); pages.push({ ar: vp.height / vp.width, pn: i }); }
    doc.destroy(); return { type: "pdf", pages };
  }
  const bmp = await createImageBitmap(file); const info = { type: "img", pages: [{ ar: bmp.height / bmp.width }], w: bmp.width, h: bmp.height }; bmp.close && bmp.close(); return info;
}
function filePages(fid, info, margin){
  return info.pages.map(p => {
    let r, w = 1000, h;
    if (margin === "r") { const fw = 650, fh = fw * p.ar; r = [0, 0, fw, fh]; h = Math.max(fh, 707); }
    else if (margin === "b") { const fh = 1000 * p.ar; r = [0, 0, 1000, fh]; h = fh + Math.max(420, fh * .6); }
    else { r = [0, 0, 1000, 1000 * p.ar]; h = r[3]; }
    const pg = { id: uid(), t: margin === "none" ? "blank" : "lined", w, h: Math.round(h * 10) / 10, f: fid, r: r.map(v => Math.round(v * 10) / 10) };
    if (p.pn) pg.pn = p.pn; return pg;
  });
}
async function shrinkImage(file, info){
  const max = 2400; if (Math.max(info.w, info.h) <= max && /jpe?g|png|webp/i.test(file.type)) return file;
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", .86));
}
async function storeImport(file, info, margin){
  const fid = uid(); let blob = file;
  if (info.type === "img") blob = await shrinkImage(file, info);
  await DB.putFile(fid, blob);
  return { pages: filePages(fid, info, margin), files: { [fid]: { n: file.name, ty: info.type, sz: blob.size } } };
}
function pickFile(multi, cb){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/pdf,.pdf,image/*"; i.multiple = !!multi;
  i.onchange = () => { const fs = [...(i.files || [])]; if (fs.length) cb(fs); }; i.click();
}
async function importMany(files, fid){

    try {

      const nr = kind === "so" ? null : guessNr(file.name) || nextNr(fid, kind);
      DB.write("notes/" + nid, { kind, nr, date: today(), title: kind === "so" ? file.name.replace(/\.[a-z0-9]+$/i, "") : "", folder: fid, pages: r.pages, files: r.files, created: Date.now(), updated: Date.now() });

const G = { on: false, k: 1 };
function gStart(pt){

}
function anchorAt(x, y){ let best = null, bd = Infinity; for (const p of ED.pages) { const d = y < p.top ? p.top - y : y > p.top + p.cssH ? y - p.top - p.cssH : 0; if (d < bd) { bd = d; best = p; } } return best && { p: best, u: (x - best.left) / best.sc, v: (y - best.top) / best.sc }; }
